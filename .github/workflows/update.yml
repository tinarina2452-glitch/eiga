name: 更新電影時刻

on:
  schedule:
    - cron: "17 22 * * *"   # 台灣時間每天 06:17
    - cron: "17 4 * * *"    # 台灣時間每天 12:17
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」立刻更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # 超過 45 分鐘就放棄，網站保留上一份資料
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取場次、產生網頁
        run: |
          mkdir -p site
          python taipei_movies.py --no-open --strict --gentle --out site/index.html
          cp icon.png site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
